name: Build Release (Master/Main)

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[Ci skip]')"
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build shadowJar

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vortexia-core-release
        path: "vortexia-core-*/build/libs/*.jar"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: "vortexia-core-*/build/libs/*.jar"
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to Hangar and Modrinth (Release)
      if: success() && startsWith(github.ref, 'refs/tags/v')
      run: |
        chmod +x gradlew
        ./gradlew :vortexia-core-paper:publishPluginPublicationToHangar :vortexia-core-paper:modrinth
      env:
        HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

